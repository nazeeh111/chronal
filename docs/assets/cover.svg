<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Chronal: evidence before exposure</title><desc id="desc">A local investment research lab. Hypothesis, portfolio, evidence. No live orders or paid APIs.</desc>
<rect width="1280" height="440" fill="#f5f4ee"/><rect width="1280" height="65" fill="#162c2d"/>
<circle cx="56" cy="32" r="15" fill="none" stroke="#e6c283" stroke-width="2"/><path d="M56 21V32L65 37" fill="none" stroke="#e6c283" stroke-width="2"/>
<text x="86" y="42" fill="#fffefa" font-family="Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="5">CHRONAL</text>
<text x="1200" y="39" text-anchor="end" fill="#d3ded4" font-family="monospace" font-size="12">LOCAL INVESTMENT RESEARCH</text>
<text x="48" y="119" fill="#586865" font-family="monospace" font-size="11" letter-spacing="2">FROM HYPOTHESIS TO A REPLAYABLE EXPERIMENT</text>
<text x="44" y="190" fill="#162c2d" font-family="Georgia,serif" font-size="66" letter-spacing="-2">Evidence before</text>
<text x="44" y="256" fill="#162c2d" font-family="Georgia,serif" font-size="66" letter-spacing="-2">exposure.</text>
<text x="48" y="300" fill="#586865" font-family="Arial,sans-serif" font-size="18">A strategy is a hypothesis. Make every assumption visible.</text>
<path d="M48 339H690" stroke="#d6ddd3"/>
<text x="48" y="374" fill="#206952" font-family="monospace" font-size="13">AVAILABLE DATA</text><text x="220" y="374" fill="#b1792b" font-family="monospace" font-size="17">→</text><text x="260" y="374" fill="#206952" font-family="monospace" font-size="13">CAUSAL SIMULATION</text><text x="455" y="374" fill="#b1792b" font-family="monospace" font-size="17">→</text><text x="495" y="374" fill="#206952" font-family="monospace" font-size="13">REPLAYABLE EVIDENCE</text>
<g transform="translate(790,100)"><rect width="440" height="285" fill="#fffefa" stroke="#d6ddd3"/><text x="24" y="35" fill="#586865" font-family="monospace" font-size="10" letter-spacing="1">RESEARCH CONTRACT</text>
<path d="M24 55H416M24 115H416M24 175H416M24 235H416" stroke="#d6ddd3"/>
<g fill="#162c2d" font-family="Georgia,serif" font-size="22"><text x="24" y="91">01</text><text x="24" y="151">02</text><text x="24" y="211">03</text></g>
<g fill="#162c2d" font-family="Arial,sans-serif" font-size="14"><text x="80" y="87">Learn from earlier observations</text><text x="80" y="147">Account for cash, costs and gaps</text><text x="80" y="207">Evaluate the frozen hypothesis</text></g>
<text x="24" y="264" fill="#586865" font-family="monospace" font-size="11">ONE RUNTIME DEPENDENCY · ZERO LIVE ORDERS</text></g>
