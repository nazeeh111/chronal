name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check chronal tests tools
      - run: ruff format --check chronal tests tools
      - run: python -m unittest discover -s tests -v
      - run: python -m chronal demo --out demo-run
      - run: node tools/check_report.cjs demo-run/development/report.html
      - run: node tools/check_report.cjs demo-run/holdout/report.html
      - run: python -m chronal verify demo-run --replay
      - run: python -m chronal study --out study-run --replications 2 --first-seed 100
      - run: python -m chronal verify study-run --replay
      - run: python -m build
